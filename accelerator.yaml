# accelerator.yaml — engagement manifest
#
# One source of truth for the engagement. Filled by the partner during the
# discovery workshop (or by `/scaffold-from-brief` custom agent reading
# docs/discovery/solution-brief.md). Read by:
#   - scripts/accelerator-lint.py (policy checks in CI)
#   - infra/ (some fields flow to Bicep parameters)
#   - evals/ (acceptance thresholds become CI gates)
#   - fleet reporting (rolled up across partner engagements)
#
# Keep it small and stable. If it feels like a DSL, something is wrong.

schema_version: "1.0"
accelerator_version: "1.0.0"   # pins to the template version partner cloned

# -----------------------------------------------------------------------------
# models:  MODEL DEPLOYMENTS — authoritative source of truth for what Bicep
# provisions inside the Foundry account. Parsed at compile time by
# `infra/main.bicep` via `loadYamlContent`; flows into
# `infra/modules/foundry.bicep`.
#
# Shape per entry:
#   - slug:            logical name referenced by `scenario.agents[].model`
#                      (slug `default` is reserved and MUST mark the default)
#   - deployment_name: actual Foundry deployment resource name
#   - model:           OpenAI model name (e.g. gpt-5-mini, gpt-4.1-mini)
#   - version:         model version string
#   - capacity:        TPM in thousands (GlobalStandard SKU)
#   - default:         exactly one entry MUST set `default: true`
#
# Omitting this whole block resets state to template defaults: Bicep
# falls back to the built-in default (gpt-5-mini / 2025-08-07 / cap 30)
# and provisions only the single default deployment. Raw
# `azd env set AZURE_AI_FOUNDRY_MODEL_NAME=...` overrides are NOT
# supported — preprovision would clobber them on every `azd up`. If
# you want a non-template default, keep the block with a single
# `default: true` entry.
# -----------------------------------------------------------------------------
models:
  - slug: default
    deployment_name: gpt-5-mini
    model: gpt-5-mini
    version: "2025-08-07"
    capacity: 30
    default: true

# -----------------------------------------------------------------------------
# landing_zone:  AZURE AI LANDING ZONE alignment tier for the engagement.
# Picked by the partner during discovery (or via /configure-landing-zone
# custom agent). Read by scripts/accelerator-lint.py (mode-consistency rule)
# and referenced from docs/patterns/azure-ai-landing-zone/README.md.
#
# Modes (pick ONE):
#   standalone      — flat single-RG deploy; fastest to stand up; partner
#                     or customer owns all guardrails. Works out of the box
#                     with infra/main.bicep and `azd up`. Best for SMB or
#                     sandbox pilots with no existing ALZ.
#   avm             — partner has swapped hand-rolled modules in infra/
#                     for Azure Verified Modules (br/public:avm/...) and
#                     added private endpoints + private DNS zones. Matches
#                     CAF/WAF recommendations but still deploys standalone
#                     (no hub). Best for mid-market or customers with some
#                     existing platform team but no AI ALZ yet.
#   alz-integrated  — partner drops the accelerator into a customer's
#                     existing Azure AI Landing Zone: resources land in a
#                     spoke subscription, private endpoints attach to the
#                     hub's private DNS zones, Foundry network isolation
#                     on, policy assignments inherited from the MG. Uses
#                     the subscription-scope overlay in infra/alz-overlay/.
#                     Best for enterprise customers with a CCoE / ALZ.
#
# Changing this value does NOT auto-rewrite infra/ — the lint rule
# `landing_zone_mode_consistent` just asserts that the infra/ shape
# matches the declared mode. Make the switch in Copilot Chat with the
# /configure-landing-zone custom agent or use the AVM reference modules in
# infra/avm-reference/ and the overlay skeleton in infra/alz-overlay/.
# -----------------------------------------------------------------------------
landing_zone:
  mode: standalone
  # avm_services (optional): required ONLY when mode == avm. List the services
  # the partner has migrated to AVM exemplars in infra/modules/. Allowed
  # tokens: key-vault | search | container-app | monitor. Foundry is currently
  # NOT listed because no fully-GA AVM res module exists for CognitiveServices
  # /accounts; it remains hand-rolled and is the documented exception.
  # Example:
  #   mode: avm
  #   avm_services: [key-vault]     # partner has swapped only KV so far
  # avm_services: []

# -----------------------------------------------------------------------------
# scenario:  HOW the accelerator plugs a concrete workflow into the framework.
# The partner changes this (or runs `scripts/scaffold-scenario.py`) to swap
# scenarios. Every field is resolved at process startup by
# `src.workflow.registry.load_scenario`.
#
# - `id`: scenario slug (hyphens allowed; appears in /healthz + logs).
# - `package`: dotted Python import path (leaf MUST use underscores).
# - `request_schema` / `workflow_factory` / `retrieval.indexes[].schema`:
#   "module:attr" form, relative to `package`. `request_schema` resolves to a
#   pydantic BaseModel subclass; `workflow_factory` resolves to a callable
#   that receives a `ScenarioContext` and returns a `BaseWorkflow`.
# - `endpoint.path`: the single POST route the FastAPI app mounts for this
#   scenario. Evals + smoke tests read this so nothing hardcodes `/research`.
# -----------------------------------------------------------------------------
scenario:
  id: contoso-supplier-risk
  package: src.scenarios.contoso_supplier_risk
  request_schema: schema:ScenarioRequest
  workflow_factory: workflow:build_workflow
  endpoint:
    path: /contoso_supplier_risk/stream
  agents:
    - { id: supervisor, foundry_name: accel-contoso-supplier-risk-supervisor }
    - { id: intake_validator, foundry_name: accel-contoso-supplier-risk-intake-validator }
    - id: evidence_retriever
      foundry_name: accel-contoso-supplier-risk-evidence-retriever
      retrieval:
        # FoundryIQ Knowledge Base pattern — bootstrap creates a Knowledge
        # Source + Knowledge Base on AI Search, then wires the agent with an
        # MCPTool pointing at the Bicep-provisioned RemoteTool MCP connection.
        # The evidence_retriever is the breadth-first grounding worker:
        # it pulls 4-8 evidence items per request to seed the evidence pack
        # consumed by risk_scorer + case_drafter.
        mode: foundry_tool
        index: supplier-evidence
        top_k: 8
        query_type: vector_semantic_hybrid
    - id: risk_scorer
      foundry_name: accel-contoso-supplier-risk-risk-scorer
      retrieval:
        # risk_scorer also reads from supplier-evidence to verify the
        # category-risk matrix and SOX control PR-04 are present and to
        # add precise policy citations to each risk factor (brief §5d
        # `policy_matrix_match` + per-factor `policy_reference`). top_k
        # is intentionally small (3) because this is a targeted lookup,
        # not a breadth retrieval — the bulk of evidence comes from the
        # upstream evidence_retriever output already in scope.
        mode: foundry_tool
        index: supplier-evidence
        top_k: 3
        query_type: vector_semantic_hybrid
    - { id: case_drafter, foundry_name: accel-contoso-supplier-risk-case-drafter }
  retrieval:
    indexes:
      - name: supplier-evidence
        seed: data/samples/contoso_supplier_risk.json
        schema: retrieval:index_definition
        # FoundryIQ Knowledge Source per-document metadata fields (citations).
        # Each evidence chunk carries provenance back to the originating
        # system so the analyst can trust the cited fact.
        source_data_fields:
          - source
          - source_system
          - category
  evals:
    quality_dataset: evals/quality/golden_cases.jsonl
    redteam_dataset: evals/redteam/cases.jsonl

# -----------------------------------------------------------------------------
# solution:  WHO + WHAT — derived from docs/discovery/solution-brief.md
# -----------------------------------------------------------------------------
solution:
  name: "contoso-supplier-risk"            # engagement slug from solution-brief.md
  brief: docs/discovery/solution-brief.md  # canonical engagement doc
  pattern: supervisor-routing              # supervisor-routing (flagship) | single-agent | chat-with-actioning
  hitl: required                           # required | optional | none
  data_residency: us                       # unset | us | eu | apac | custom
  identity: entra-id                       # entra-id | external-id | custom
  side_effect_tools:                       # every name here must exist in src/tools/ and pass HITL
    - create_supplier_risk_case            # ServiceNow procurement-risk case (HITL required)
    - update_supplier_review_status        # Dynamics 365 Finance supplier onboarding note (HITL required)
  grounding_sources:
    - ai_search_index: supplier-evidence   # SharePoint policy + Azure SQL supplier master + uploaded evidence
    - dynamics_365_finance: supplier_profile_api
    - servicenow: procurement_risk_workspace

# -----------------------------------------------------------------------------
# acceptance:  MEASURABLE GATES — lint verifies each has a matching eval
# -----------------------------------------------------------------------------
acceptance:
  quality_threshold: 0.90      # ≥ 0.90 reviewer agreement on supplier-risk golden cases (brief §7)
  groundedness_threshold: 0.92 # ≥ 0.92 on RAG cases; every factual risk claim must cite an approved source
  p95_latency_ms: 120000       # 120s P95 per brief §7 (P50 target 45s)
  cost_per_call_usd: 0.42      # $ per supplier review (brief §7)
  redteam_must_pass: true      # XPIA + jailbreak + HITL-bypass — zero tolerance

# -----------------------------------------------------------------------------
# controls:  NON-NEGOTIABLES — enforced by lint + infra
# -----------------------------------------------------------------------------
controls:
  managed_identity: true       # no keys in app code
  key_vault: true              # all secrets referenced, never inlined
  content_filters: iac         # iac | portal (portal is a lint failure)
  private_endpoints: optional  # required | optional (env-dependent)
  telemetry: required          # App Insights wired, custom events emitted
  evals_in_ci: required        # evals/ runs on every PR

# -----------------------------------------------------------------------------
# kpis:  ROI INSTRUMENTATION — typed events emitted by accelerator_baseline.telemetry
# -----------------------------------------------------------------------------
kpis:
  - name: supplier_review_cycle_time
    type: duration_ms
    baseline: 6600000          # 110 minutes manual median (brief §3)
    target:   1080000          # 18 minutes target median (brief §3)
  - name: autonomous_triage_coverage
    type: ratio
    baseline: 0.00             # no autonomous triage today
    target:   0.72             # 72% of cases drafted end-to-end without analyst rework
  - name: hitl_approval_rate
    type: ratio
    baseline: 1.00             # 100% manual approval on every case today
    target:   0.88             # 88% of agent-drafted cases approved as-presented
