# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
  extensions:
    microsoft.foundry: '>=1.0.0-beta.1'

name: agentic-ai-solution-accelerator-prompt-agent

services:
  ai-project:
    host: azure.ai.project
    deployments:
      - model:
          format: OpenAI
          name: gpt-5-mini
          version: "2025-08-07"
        name: gpt-5-mini
        sku:
          capacity: 30
          name: GlobalStandard

infra:
  provider: microsoft.foundry
  path: ../hosted-preview/infra
  module: main

hooks:
  preprovision:
    run: azd env set AZURE_DEPLOYMENT_SURFACE foundry-prompt
  postprovision:
    - run: python ../hosted-preview/hooks/normalize_env.py
    - run: python ../../scripts/foundry-provision.py
